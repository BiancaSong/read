<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>읽기 녹음 · 영어 독해 연습</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --bg:#E9EDEF;
  --card:#FFFFFF;
  --ink:#16262E;
  --muted:#6C818B;
  --line:#D3DBDF;
  --teal:#0E6E63;
  --teal-soft:#DCEDE9;
  --red:#CE3A2F;
  --red-soft:#F7E3E1;
  --amber:#E8A33D;
  --radius:14px;
  --dock-h:150px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  font-size:16px;
  line-height:1.6;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:580px;margin:0 auto;padding:18px 16px calc(var(--dock-h) + 24px)}
.wrap.no-dock{padding-bottom:32px}

/* ---- header ---- */
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand span{color:var(--teal)}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;padding:4px;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}

/* ---- step rail ---- */
.rail{display:flex;align-items:center;gap:0;margin:0 0 20px}
.stop{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.stop::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.stop:first-child::before{display:none}
.stop.done::before,.stop.here::before{background:var(--teal)}
.dot{position:relative;z-index:1;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  background:var(--card);border:2px solid var(--line);color:var(--muted);font-size:13px;font-weight:700}
.stop.here .dot{background:var(--teal);border-color:var(--teal);color:#fff}
.stop.done .dot{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
.stop small{font-size:12px;color:var(--muted);font-weight:600}
.stop.here small{color:var(--teal)}

/* ---- cards ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card + .card{margin-top:14px}
.title{font-size:14px;font-weight:700;color:var(--muted);margin:0 0 8px}
h1{font-size:21px;line-height:1.35;margin:0 0 4px;letter-spacing:-.02em}
.meta{font-size:13px;color:var(--muted);margin:0 0 16px}

/* ---- passage ---- */
.passage{
  font-family:'Charter','Bitstream Charter','Iowan Old Style','Source Serif Pro',Georgia,'Times New Roman',serif;
  font-size:20px;line-height:1.85;letter-spacing:.005em;
  max-height:46vh;overflow-y:auto;padding-right:4px;
}
.passage .w{border-radius:3px;padding:1px 0}
.passage .w.on{background:var(--amber);box-shadow:0 0 0 3px var(--amber)}
.hint{font-size:13px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}

/* ---- form ---- */
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
input[type=text],textarea{
  width:100%;font:inherit;color:var(--ink);background:#FBFCFC;
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;
}
textarea{min-height:180px;resize:vertical;line-height:1.7}
input[type=text]:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal)}
.field + .field{margin-top:14px}

/* ---- buttons ---- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font:inherit;font-weight:700;font-size:16px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:12px;padding:13px 18px;width:100%;
}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.rec{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{width:auto;font-size:14px;padding:9px 14px;font-weight:600}
.btn:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.row{display:flex;gap:10px}
.row .btn{flex:1}

/* ---- dock ---- */
.dock{
  position:fixed;left:0;right:0;bottom:0;background:rgba(233,237,239,.94);
  backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding:14px 16px calc(14px + env(safe-area-inset-bottom));
}
.dock-inner{max-width:580px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.dock-status{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:30px}
.tc{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px;letter-spacing:.02em}
.tc.live{color:var(--red)}
.speed{display:flex;gap:6px}
.chip{font:inherit;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.chip[aria-pressed=true]{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}

/* ---- level meter ---- */
.meter{display:flex;align-items:flex-end;gap:3px;height:26px;flex:1}
.meter i{flex:1;background:var(--line);border-radius:2px;height:14%;transition:height .06s linear}
.meter i.hot{background:var(--red)}

.recdot{width:9px;height:9px;border-radius:50%;background:var(--red);display:inline-block;animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.recdot{animation:none}}

.note{font-size:13px;color:var(--muted);line-height:1.65}
.note code{background:#DFE5E8;padding:1px 5px;border-radius:4px;font-size:12px}
.linkbox{display:flex;gap:8px;margin-top:10px}
.linkbox input{flex:1;font-size:13px}
.ok{color:var(--teal);font-weight:700;font-size:14px}
.err{color:var(--red);font-weight:600;font-size:14px;margin-top:10px}
audio{width:100%;margin-top:12px}
.hidden{display:none !important}
</style>
</head>
<body>

<div class="wrap" id="wrap">
  <header>
    <div class="brand">읽기 녹음 <span>· Read &amp; Record</span></div>
    <button class="linkbtn" id="toSetup">선생님용</button>
  </header>

  <!-- ========== 선생님: 지문 만들기 ========== -->
  <section id="view-setup" class="hidden">
    <div class="card">
      <h1>지문 등록</h1>
      <p class="meta">지문을 넣고 링크를 만들어 학생에게 보내세요. 링크 안에 지문이 담겨 있어 서버가 필요 없습니다.</p>
      <div class="field">
        <label for="fBase">이 페이지의 배포 주소</label>
        <input type="text" id="fBase" placeholder="https://아이디.github.io/read/index.html" inputmode="url" spellcheck="false">
        <p class="note" id="baseNote" style="margin-top:6px"></p>
      </div>
      <div class="field">
        <label for="fTitle">제목</label>
        <input type="text" id="fTitle" placeholder="예) Lesson 3 – The Honey Bee">
      </div>
      <div class="field">
        <label for="fText">영어 지문</label>
        <textarea id="fText" placeholder="영어 지문을 붙여넣으세요."></textarea>
      </div>
      <div class="row" style="margin-top:16px">
        <button class="btn primary" id="btnMakeLink">학생용 링크 만들기</button>
        <button class="btn" id="btnStartHere">이 기기에서 바로 시작</button>
      </div>
      <div id="linkResult" class="hidden">
        <div class="linkbox">
          <input type="text" id="outLink" readonly>
          <button class="btn sm" id="btnCopy">복사</button>
        </div>
        <p class="note" id="linkNote" style="margin-top:8px"></p>
      </div>
    </div>
  </section>

  <!-- ========== 학생: 이름 입력 ========== -->
  <section id="view-start" class="hidden">
    <div class="card">
      <h1 id="startTitle">지문 읽기</h1>
      <p class="meta">듣기 → 녹음 → 확인 → 전송, 네 단계로 진행합니다.</p>
      <div class="field">
        <label for="fName">이름</label>
        <input type="text" id="fName" placeholder="예) 김민서" autocomplete="name">
      </div>
      <button class="btn primary" id="btnBegin" style="margin-top:16px">시작하기</button>
      <p class="err hidden" id="nameErr">이름을 입력해 주세요.</p>
    </div>
  </section>

  <!-- ========== 학생: 4단계 ========== -->
  <section id="view-practice" class="hidden">
    <nav class="rail" id="rail" aria-label="진행 단계">
      <div class="stop" data-s="1"><div class="dot">1</div><small>듣기</small></div>
      <div class="stop" data-s="2"><div class="dot">2</div><small>녹음</small></div>
      <div class="stop" data-s="3"><div class="dot">3</div><small>확인</small></div>
      <div class="stop" data-s="4"><div class="dot">4</div><small>전송</small></div>
    </nav>

    <div class="card">
      <h1 id="pTitle">지문</h1>
      <p class="meta" id="pMeta"></p>
      <div class="passage" id="pText"></div>
      <p class="hint" id="pHint">먼저 한 번 들어 보세요. 발음과 끊어 읽기에 집중합니다.</p>
    </div>

    <div class="card hidden" id="playbackCard">
      <p class="title">내 녹음</p>
      <audio id="myAudio" controls preload="metadata"></audio>
    </div>

    <div class="card hidden" id="sendCard">
      <p class="title">전송</p>
      <p class="note" id="sendNote"></p>
      <p class="err hidden" id="sendErr"></p>
    </div>
  </section>
</div>

<!-- ========== 하단 조작부 ========== -->
<div class="dock hidden" id="dock">
  <div class="dock-inner">
    <div class="dock-status" id="dockStatus"></div>
    <div id="dockActions"></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ---------------- state ---------------- */
var S = {
  step: 1,
  title: "",
  text: "",
  name: "",
  rate: 1,
  listened: false,
  blob: null,
  mime: "",
  ext: "webm",
  url: null
};
var wordEls = [], wordRanges = [];
var media = { rec:null, stream:null, ctx:null, analyser:null, raf:0, t0:0, timer:0 };

var $ = function(id){ return document.getElementById(id); };
var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------------- utils ---------------- */
function esc(s){ return s.replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function b64enc(str){ return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function b64dec(str){
  return decodeURIComponent(escape(atob(unpad(str))));
}
function unpad(str){
  str = str.replace(/-/g,"+").replace(/_/g,"/");
  while(str.length % 4) str += "=";
  return str;
}
function bytesToB64(bytes){
  var bin = "", CH = 0x8000;
  for(var i=0;i<bytes.length;i+=CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+CH));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64ToBytes(str){
  var bin = atob(unpad(str)), out = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
/* deflate-raw로 압축해 링크를 짧게 만든다. 미지원 브라우저는 평문 base64로 폴백. */
function pack(obj){
  var json = JSON.stringify(obj);
  if(!window.CompressionStream) return Promise.resolve("p=" + b64enc(json));
  try{
    var stream = new Blob([new TextEncoder().encode(json)]).stream()
      .pipeThrough(new CompressionStream("deflate-raw"));
    return new Response(stream).arrayBuffer()
      .then(function(buf){ return "z=" + bytesToB64(new Uint8Array(buf)); })
      .catch(function(){ return "p=" + b64enc(json); });
  }catch(e){ return Promise.resolve("p=" + b64enc(json)); }
}
function unpack(kind, data){
  if(kind === "p") return Promise.resolve(JSON.parse(b64dec(data)));
  if(!window.DecompressionStream) return Promise.reject(new Error("no DecompressionStream"));
  var stream = new Blob([b64ToBytes(data)]).stream()
    .pipeThrough(new DecompressionStream("deflate-raw"));
  return new Response(stream).text().then(JSON.parse);
}
/* 아티팩트 미리보기(about:srcdoc)나 file:// 에서는 자기 주소를 링크로 쓸 수 없다. */
function pageBase(){
  var h = location.href.split("#")[0];
  return /^https?:\/\//.test(h) ? h : "";
}
function mmss(ms){
  var t = Math.floor(ms/1000);
  return String(Math.floor(t/60)).padStart(2,"0") + ":" + String(t%60).padStart(2,"0");
}
function today(){
  var d = new Date();
  return String(d.getFullYear()).slice(2) + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0");
}
function safe(s){ return (s||"").replace(/[\\/:*?"<>|]/g,"").replace(/\s+/g,"_").slice(0,40); }
function show(id, on){ $(id).classList.toggle("hidden", !on); }

/* ---------------- views ---------------- */
function view(name){
  ["setup","start","practice"].forEach(function(v){ show("view-"+v, v===name); });
  show("dock", name==="practice");
  $("wrap").classList.toggle("no-dock", name!=="practice");
  show("toSetup", name!=="setup");
  window.scrollTo(0,0);
}

/* ---------------- passage rendering ---------------- */
function renderPassage(text){
  var parts = text.split(/(\s+)/), html = "", idx = 0;
  wordRanges = [];
  parts.forEach(function(p){
    if(!p) return;
    if(/^\s+$/.test(p)){
      html += p.indexOf("\n") >= 0 ? "<br>" : " ";
    } else {
      wordRanges.push([idx, idx + p.length]);
      html += '<span class="w" data-i="' + (wordRanges.length-1) + '">' + esc(p) + "</span>";
    }
    idx += p.length;
  });
  $("pText").innerHTML = html;
  wordEls = Array.prototype.slice.call($("pText").querySelectorAll(".w"));
}
function highlight(charIndex){
  var hit = -1;
  for(var i=0;i<wordRanges.length;i++){
    if(charIndex >= wordRanges[i][0] && charIndex < wordRanges[i][1]){ hit = i; break; }
  }
  if(hit < 0) return;
  wordEls.forEach(function(el){ el.classList.remove("on"); });
  var el = wordEls[hit];
  if(!el) return;
  el.classList.add("on");
  var box = $("pText").getBoundingClientRect(), r = el.getBoundingClientRect();
  if(r.top < box.top + 20 || r.bottom > box.bottom - 20){
    el.scrollIntoView({block:"center", behavior: reduceMotion ? "auto" : "smooth"});
  }
}
function clearHighlight(){ wordEls.forEach(function(el){ el.classList.remove("on"); }); }

/* ---------------- step 1: 듣기 (TTS) ---------------- */
function pickVoice(){
  var vs = speechSynthesis.getVoices().filter(function(v){ return /^en/i.test(v.lang); });
  if(!vs.length) return null;
  var pref = vs.find(function(v){ return /Samantha|Google US English|Aria|Jenny|Natural/i.test(v.name); });
  return pref || vs[0];
}
function speak(){
  if(!("speechSynthesis" in window)){
    alert("이 브라우저는 음성 재생을 지원하지 않습니다. 크롬이나 사파리 최신 버전에서 열어 주세요.");
    return;
  }
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(S.text);
  var v = pickVoice();
  if(v) u.voice = v;
  u.lang = v ? v.lang : "en-US";
  u.rate = S.rate;
  u.onboundary = function(e){ if(typeof e.charIndex === "number") highlight(e.charIndex); };
  u.onend = function(){ clearHighlight(); S.listened = true; paintDock(); };
  u.onerror = function(){ clearHighlight(); paintDock(); };
  S.listened = true;
  speechSynthesis.speak(u);
  paintDock();
}
function speaking(){ return "speechSynthesis" in window && speechSynthesis.speaking; }
function stopSpeak(){ if("speechSynthesis" in window) speechSynthesis.cancel(); clearHighlight(); paintDock(); }

/* ---------------- step 2: 녹음 ---------------- */
function pickMime(){
  var list = ["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus","audio/aac"];
  for(var i=0;i<list.length;i++){
    if(window.MediaRecorder && MediaRecorder.isTypeSupported(list[i])) return list[i];
  }
  return "";
}
function startRec(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
    fail("이 브라우저에서는 녹음을 쓸 수 없습니다. 크롬 또는 사파리 최신 버전에서 열어 주세요.");
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true } })
  .then(function(stream){
    media.stream = stream;
    var mime = pickMime();
    S.mime = mime || "audio/webm";
    S.ext = /mp4|aac/.test(S.mime) ? "m4a" : (/ogg/.test(S.mime) ? "ogg" : "webm");
    var chunks = [];
    media.rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
    media.rec.ondataavailable = function(e){ if(e.data && e.data.size) chunks.push(e.data); };
    media.rec.onstop = function(){
      if(S.url) URL.revokeObjectURL(S.url);
      S.blob = new Blob(chunks, { type: S.mime });
      S.url = URL.createObjectURL(S.blob);
      $("myAudio").src = S.url;
      teardownMeter();
      go(3);
    };
    media.rec.start();
    media.t0 = Date.now();
    setupMeter(stream);
    media.timer = setInterval(paintDock, 250);
    paintDock();
  })
  .catch(function(){
    fail("마이크를 사용할 수 없습니다. 브라우저 주소창의 마이크 권한을 허용한 뒤 다시 눌러 주세요.");
  });
}
function stopRec(){
  if(media.rec && media.rec.state !== "inactive") media.rec.stop();
  clearInterval(media.timer); media.timer = 0;
  if(media.stream) media.stream.getTracks().forEach(function(t){ t.stop(); });
  media.stream = null;
}
function setupMeter(stream){
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    media.ctx = new AC();
    var src = media.ctx.createMediaStreamSource(stream);
    media.analyser = media.ctx.createAnalyser();
    media.analyser.fftSize = 512;
    src.connect(media.analyser);
    var buf = new Uint8Array(media.analyser.fftSize);
    var tick = function(){
      media.analyser.getByteTimeDomainData(buf);
      var sum = 0;
      for(var i=0;i<buf.length;i++){ var d = (buf[i]-128)/128; sum += d*d; }
      var rms = Math.sqrt(sum/buf.length);
      var bars = document.querySelectorAll("#meter i");
      for(var b=0;b<bars.length;b++){
        var jitter = 0.55 + 0.45*Math.sin((Date.now()/90) + b);
        var h = Math.min(100, 14 + rms*380*jitter);
        bars[b].style.height = h + "%";
        bars[b].classList.toggle("hot", h > 55);
      }
      media.raf = requestAnimationFrame(tick);
    };
    tick();
  }catch(e){ /* meter is optional */ }
}
function teardownMeter(){
  if(media.raf) cancelAnimationFrame(media.raf);
  media.raf = 0;
  if(media.ctx && media.ctx.state !== "closed"){ try{ media.ctx.close(); }catch(e){} }
  media.ctx = null; media.analyser = null;
}
function recording(){ return !!(media.rec && media.rec.state === "recording"); }

/* ---------------- step 4: 전송 ---------------- */
function filename(){
  return safe(S.name) + "_" + safe(S.title || "reading") + "_" + today() + "." + S.ext;
}
function sendFile(){
  if(!S.blob) return;
  var f = new File([S.blob], filename(), { type: S.mime });
  var payload = { files:[f], title: filename(), text: S.name + " · " + (S.title||"지문 읽기") + " · " + today() };
  if(navigator.canShare && navigator.canShare({ files:[f] }) && navigator.share){
    navigator.share(payload).then(function(){
      $("sendNote").innerHTML = '<span class="ok">전송 창을 열었습니다.</span> 카카오톡에서 선생님을 선택하면 끝납니다.';
    }).catch(function(){ /* user cancelled */ });
  } else {
    downloadFile();
    $("sendNote").innerHTML = '<span class="ok">파일을 저장했습니다.</span> 카카오톡 대화창에서 파일 첨부로 <code>' + esc(filename()) + '</code> 를 보내 주세요.';
  }
}
function downloadFile(){
  if(!S.blob) return;
  var a = document.createElement("a");
  a.href = S.url;
  a.download = filename();
  document.body.appendChild(a); a.click(); a.remove();
}
function fail(msg){
  var e = $("sendErr");
  e.textContent = msg;
  e.classList.remove("hidden");
  $("sendCard").classList.remove("hidden");
}

/* ---------------- step machine ---------------- */
function go(step){
  S.step = step;
  if(step !== 1) stopSpeak();
  Array.prototype.forEach.call(document.querySelectorAll("#rail .stop"), function(el){
    var n = +el.dataset.s;
    el.classList.toggle("here", n === step);
    el.classList.toggle("done", n < step);
  });
  show("playbackCard", step >= 3);
  show("sendCard", step === 4);
  $("sendErr").classList.add("hidden");

  var hints = {
    1:"먼저 한 번 들어 보세요. 발음과 끊어 읽기에 집중합니다.",
    2:"지문을 보면서 소리 내어 읽으세요. 틀려도 멈추지 말고 끝까지 갑니다.",
    3:"내 녹음을 들어 보세요. 마음에 들지 않으면 다시 녹음할 수 있습니다.",
    4:"선생님께 보내면 끝입니다."
  };
  $("pHint").textContent = hints[step];
  if(step === 4){
    $("sendNote").innerHTML = "파일 이름 <code>" + esc(filename()) + "</code> 으로 보냅니다.";
  }
  paintDock();
  window.scrollTo({ top:0, behavior: reduceMotion ? "auto" : "smooth" });
}

/* ---------------- dock painting ---------------- */
function paintDock(){
  var st = $("dockStatus"), ac = $("dockActions");
  st.innerHTML = ""; ac.innerHTML = "";

  if(S.step === 1){
    st.innerHTML =
      '<span class="note">' + (speaking() ? "재생 중" : "듣기 속도") + "</span>" +
      '<span class="speed">' +
        '<button class="chip" data-rate="0.75" aria-pressed="' + (S.rate===0.75) + '">느리게</button>' +
        '<button class="chip" data-rate="1" aria-pressed="' + (S.rate===1) + '">보통</button>' +
      "</span>";
    ac.innerHTML =
      '<div class="row">' +
        '<button class="btn primary" id="aPlay">' + (speaking() ? "멈추기" : "지문 듣기") + "</button>" +
        '<button class="btn" id="aNext"' + (S.listened ? "" : " disabled") + ">녹음하러 가기</button>" +
      "</div>";
    $("aPlay").onclick = function(){ speaking() ? stopSpeak() : speak(); };
    $("aNext").onclick = function(){ go(2); };
    Array.prototype.forEach.call(st.querySelectorAll(".chip"), function(c){
      c.onclick = function(){ S.rate = parseFloat(c.dataset.rate); stopSpeak(); paintDock(); };
    });

  } else if(S.step === 2){
    if(recording()){
      st.innerHTML = '<span class="tc live"><span class="recdot"></span> ' + mmss(Date.now()-media.t0) + "</span>" +
                     '<span class="meter" id="meter">' + "<i></i>".repeat(20) + "</span>";
      ac.innerHTML = '<button class="btn primary" id="aStop">녹음 끝내기</button>';
      $("aStop").onclick = stopRec;
    } else {
      st.innerHTML = '<span class="note">준비되면 눌러서 소리 내어 읽으세요.</span>';
      ac.innerHTML =
        '<div class="row">' +
          '<button class="btn rec" id="aRec">● 녹음 시작</button>' +
          '<button class="btn" id="aBack">다시 듣기</button>' +
        "</div>";
      $("aRec").onclick = startRec;
      $("aBack").onclick = function(){ go(1); };
    }

  } else if(S.step === 3){
    st.innerHTML = '<span class="note">녹음을 들어 보고 다음으로 넘어가세요.</span>';
    ac.innerHTML =
      '<div class="row">' +
        '<button class="btn" id="aRedo">다시 녹음</button>' +
        '<button class="btn primary" id="aGo4">전송하기</button>' +
      "</div>";
    $("aRedo").onclick = function(){ $("myAudio").pause(); go(2); };
    $("aGo4").onclick = function(){ go(4); };

  } else {
    st.innerHTML = '<span class="note">' + esc(S.name) + " · " + esc(S.title || "지문 읽기") + "</span>";
    ac.innerHTML =
      '<button class="btn primary" id="aSend">선생님께 보내기</button>' +
      '<div class="row" style="margin-top:10px">' +
        '<button class="btn sm" id="aSave">파일로 저장</button>' +
        '<button class="btn sm" id="aAgain">처음부터 다시</button>' +
      "</div>";
    $("aSend").onclick = sendFile;
    $("aSave").onclick = function(){
      downloadFile();
      $("sendNote").innerHTML = '<span class="ok">저장했습니다.</span> 카카오톡 파일 첨부로 <code>' + esc(filename()) + "</code> 를 보내 주세요.";
    };
    $("aAgain").onclick = function(){ S.blob=null; S.listened=false; $("myAudio").removeAttribute("src"); go(1); };
  }
}

/* ---------------- wiring ---------------- */
$("toSetup").onclick = function(){ stopSpeak(); stopRec(); openSetup(); };

$("btnMakeLink").onclick = function(){
  var t = $("fText").value.trim();
  if(!t){ $("fText").focus(); return; }
  var base = $("fBase").value.trim();
  if(!/^https?:\/\/\S+/.test(base)){
    $("baseNote").innerHTML = '<span style="color:var(--red);font-weight:600">배포 주소를 먼저 입력해 주세요.</span> 학생이 열 수 있는 <code>https://</code> 주소여야 합니다.';
    $("fBase").focus();
    return;
  }
  pack({ t: $("fTitle").value.trim(), x: t }).then(function(frag){
    var url = base.split("#")[0] + "#" + frag;
    $("outLink").value = url;
    $("linkNote").innerHTML = "길이 " + url.length + "자. 카카오톡·클래스룸에 그대로 붙여넣으세요." +
      (url.length > 6000 ? ' <span style="color:var(--red)">지문이 길어 일부 메신저에서 잘릴 수 있습니다. 문단을 나눠 두 과제로 만드는 편이 안전합니다.</span>' : "");
    show("linkResult", true);
    $("outLink").select();
  });
};
$("btnCopy").onclick = function(){
  $("outLink").select();
  var done = function(){ $("btnCopy").textContent = "복사됨"; setTimeout(function(){ $("btnCopy").textContent = "복사"; }, 1500); };
  if(navigator.clipboard) navigator.clipboard.writeText($("outLink").value).then(done, done);
  else { document.execCommand("copy"); done(); }
};
$("btnStartHere").onclick = function(){
  var t = $("fText").value.trim();
  if(!t){ $("fText").focus(); return; }
  loadPassage($("fTitle").value.trim(), t);
};

$("btnBegin").onclick = function(){
  var n = $("fName").value.trim();
  if(!n){ show("nameErr", true); $("fName").focus(); return; }
  show("nameErr", false);
  S.name = n;
  $("pTitle").textContent = S.title || "지문 읽기";
  $("pMeta").textContent = S.name + " · " + new Date().toLocaleDateString("ko-KR");
  view("practice");
  go(1);
};
$("fName").addEventListener("keydown", function(e){ if(e.key === "Enter") $("btnBegin").click(); });

function loadPassage(title, text){
  S.title = title; S.text = text;
  renderPassage(text);
  $("startTitle").textContent = title || "지문 읽기";
  view("start");
  setTimeout(function(){ $("fName").focus(); }, 120);
}

/* voices load lazily in Chrome */
if("speechSynthesis" in window){ speechSynthesis.onvoiceschanged = function(){}; speechSynthesis.getVoices(); }

function openSetup(){
  view("setup");
  var base = pageBase();
  $("fBase").value = base;
  $("baseNote").innerHTML = base
    ? "이 페이지 주소를 자동으로 넣었습니다."
    : '이 페이지가 아직 웹에 올라가 있지 않아 주소를 알 수 없습니다. GitHub Pages 등에 올린 뒤 그 주소를 넣어 주세요. <code>file://</code> 이나 미리보기 화면에서는 학생 마이크도 열리지 않습니다.';
}

/* boot */
(function boot(){
  var m = location.hash.match(/[#&](p|z)=([^&]+)/);
  if(m){
    unpack(m[1], m[2]).then(function(d){
      if(d && d.x) loadPassage(d.t || "", d.x);
      else openSetup();
    }).catch(openSetup);
    return;
  }
  openSetup();
})();

window.addEventListener("beforeunload", function(){ stopSpeak(); stopRec(); });
})();
</script>
</body>
</html>
